name: WhatsApp Appointment Reminders

# Vercel Hobby only allows 1 cron/day, so we schedule reminders here instead.
# Every 5 minutes â€” GitHub schedule events are often delayed, so keep this frequent.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          URL="https://salon-i-squad.vercel.app/api/whatsapp/reminders"
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" "$URL"
          else
            curl -fsS "$URL"
          fi
          echo
