name: WhatsApp Appointment Reminders

# Backup pinger. Primary tick is Firebase every 5 minutes.
# GitHub often delays */5 jobs, so also fire on the hour and :30.
on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          URL="https://salon-i-squad.vercel.app/api/whatsapp/reminders"
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" "$URL"
          else
            curl -fsS "$URL"
          fi
          echo
